{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}JB Kim | Portfolio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="site-header">
        <nav class="navbar navbar-expand">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">JB Kim</a>
                <div class="navbar-nav ms-auto">
                    {% with url_name=request.resolver_match.url_name %}
                    <a class="nav-link{% if url_name == 'home' %} active{% endif %}" href="{% url 'home' %}"{% if url_name == 'home' %} aria-current="page"{% endif %}>Home</a>
                    <a class="nav-link{% if url_name == 'about' %} active{% endif %}" href="{% url 'about' %}"{% if url_name == 'about' %} aria-current="page"{% endif %}>About</a>
                    <a class="nav-link{% if url_name == 'projects' %} active{% endif %}" href="{% url 'projects' %}"{% if url_name == 'projects' %} aria-current="page"{% endif %}>Projects</a>
                    <a class="nav-link{% if url_name == 'guestbook' or url_name == 'guestbook_reply' %} active{% endif %}" href="{% url 'guestbook' %}"{% if url_name == 'guestbook' or url_name == 'guestbook_reply' %} aria-current="page"{% endif %}>Guestbook</a>
                    {% endwith %}
                </div>
            </div>
        </nav>
    </header>

    <main class="site-main flex-grow-1">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="site-footer py-4">
        <div class="container">
            <p class="mb-0">&copy; 2026 JB Kim. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
